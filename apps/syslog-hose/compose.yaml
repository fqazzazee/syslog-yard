services:
  syslog-hose:
    build:
      # context is the parent apps/ dir: the image also copies apps/shared
      context: ..
      dockerfile: syslog-hose/Dockerfile
    image: syslog-hose:latest
    container_name: syslog-hose
    ports:
      - "8080:8080"
    volumes:
      - syslog-hose-data:/data
    restart: unless-stopped

volumes:
  syslog-hose-data:
