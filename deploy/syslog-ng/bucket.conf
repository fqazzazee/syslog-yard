@version: 4.8

# syslog-bucket front-end receiver (suite edition): accept syslog on the wire,
# hand structured JSON lines to the syslog-bucket ingest worker. Identical to
# apps/syslog-bucket/deploy/syslog-ng/syslog-ng.conf except the destination
# host matches the suite service name.

options {
    keep-hostname(yes);
    use-dns(no);
    frac-digits(3);
    time-reopen(2);
};

# Port 514: classic RFC 3164, RFC 5424, or a bare "<PRI>payload" line
# (FortiGate, SonicWall). network() alone parses everything as RFC 3164,
# which turns a 5424 line into app "1" with the sender IP as host, so the
# drivers take the line unparsed and the channel picks the parser per
# message. Same logic as the syslog-valve sources it usually receives from.
source s_514 {
    channel {
        source {
            network(transport("udp") port(514) flags(no-parse));
            network(transport("tcp") port(514) flags(no-parse));
        };
        if (message("^<[0-9]{1,3}>1 ")) {
            parser { syslog-parser(flags(syslog-protocol)); };
        } else {
            parser { syslog-parser(); };
        };
    };
};

# RFC5424 (modern syslog protocol)
source s_rfc5424 {
    syslog(transport("tcp") port(601));
};

destination d_bucket {
    network("syslog-bucket" port(6601) transport("tcp")
        template("$(format-json time=\"${ISODATE}\" host=\"${HOST}\" app=\"${PROGRAM}\" pid=\"${PID}\" msgid=\"${MSGID}\" facility=\"${FACILITY}\" severity=\"${LEVEL}\" message=\"${MESSAGE}\" source_ip=\"${SOURCEIP}\")\n")
    );
};

# RFC 5424 structured data has no field of its own in the JSON record, so
# it is kept at the front of the message (the bucket parses its key="value"
# pairs into structured fields).
rewrite r_sdata {
    set("${SDATA} ${MESSAGE}" value("MESSAGE") condition("${SDATA}" ne ""));
};

log {
    source(s_514);
    source(s_rfc5424);
    rewrite(r_sdata);
    destination(d_bucket);
};
